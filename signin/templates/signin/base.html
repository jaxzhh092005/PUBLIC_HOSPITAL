{% load static %}
{% static 'signin/images/logo.png' as logo_path %}
{% static 'signin/images/campus.png' as campus_path %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'signin/css/auth.css' %}">
</head>
<body>
  <main class="auth">
    <section class="auth__panel">
      <a class="auth__tag" href="{% block tag_href %}#{% endblock %}">{% block tag %}Back{% endblock %}</a>

      <div class="auth__content">
        <div class="auth__logo">
          <img src="{{ logo_path }}" alt="Public Hospital" onerror="this.style.display='none'">
        </div>
        {% block content %}{% endblock %}
      </div>

      <footer class="auth__footer">
        <span>{% block footer_left %}{% endblock %}</span>
        <span class="auth__socials">
          <a href="#" aria-label="Facebook">f</a>
          <a href="#" aria-label="Instagram">◎</a>
          <a href="#" aria-label="Website">⌂</a>
        </span>
      </footer>
    </section>

    <aside class="auth__photo" style="background-image: url('{{ campus_path }}');" aria-hidden="true"></aside>
  </main>
  <script>
    document.querySelectorAll('input[type="email"]').forEach((input) => {
      const feedback = document.getElementById(`${input.id}-error`);
      const getMessage = () => {
        if (input.validity.valueMissing) return "Please enter your email address.";
        if (input.validity.typeMismatch) return "Please enter a valid email address.";
        return "";
      };
      const showMessage = () => {
        const message = getMessage();
        input.setCustomValidity(message);
        if (feedback) feedback.textContent = message;
      };

      input.addEventListener("invalid", showMessage);
      input.addEventListener("blur", () => {
        if (input.value) showMessage();
      });
      input.addEventListener("input", () => {
        input.setCustomValidity("");
        const message = input.value ? getMessage() : "";
        input.setCustomValidity(message);
        if (feedback) feedback.textContent = message;
      });
    });
  </script>
</body>
</html>
