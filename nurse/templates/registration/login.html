{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CarePoint</title>
    <link rel="stylesheet" href="{% static 'nurse/css/dashboard.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <p class="eyebrow">CarePoint</p>
        <h1>Sign in</h1>
        <p class="subheading">Sign in to open your nurse workspace.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="button button-primary login-button" type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
