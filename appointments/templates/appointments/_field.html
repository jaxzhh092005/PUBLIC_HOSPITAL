<div class="field span-{{ span|default:2 }}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
