{% load static %}
<header class="navbar">
  <a href="{% url 'home:home' %}" class="navbar-brand">
    <img src="{% static 'images/logo.png' %}" alt="Public Hospital logo">
  </a>

  <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"
          onclick="const l=document.getElementById('navLinks');const o=l.classList.toggle('open');this.setAttribute('aria-expanded',o)">
    <i class="bi bi-list"></i>
  </button>

  <ul class="nav-links" id="navLinks">
    <li><a href="{% url 'home:home' %}" {% if request.resolver_match.app_name == 'home' %}class="active"{% endif %}>Home</a></li>
    <li><a href="#">Doctors</a></li>
    <li><a href="#">Bookings</a></li>
    <li><a href="#">Files</a></li>
    <li><a href="{% url 'accounts:detail' %}" class="nav-settings" aria-label="Settings"><i class="bi bi-gear"></i></a></li>
  </ul>
</header>
